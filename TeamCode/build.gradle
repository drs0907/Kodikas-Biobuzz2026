apply plugin: 'com.android.application'

apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

dependencies {
    // FTCLib (Core & Hardware)
    implementation 'com.ftclib.ftclib:core:2.1.1'
    implementation 'com.ftclib.ftclib:hardware:2.1.1'

    // Pedro Pathing v3
    implementation 'com.github.pedropathing:pedropathing:0.5.2'

    // FTC Panels
    implementation 'com.github.PanelsFTC:Panels:1.0.0'

    implementation project(':FtcRobotController')
}

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }
}